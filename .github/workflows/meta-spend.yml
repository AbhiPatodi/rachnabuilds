name: Meta ad spend sync

# Every hour: store spend and leads per day, refresh the prepaid balance, warn
# when it's under the line, and push today's numbers to the owner's phones when
# they moved since the last hour (?pulse=1).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      extra:
        description: 'Extra query string, e.g. &apps=1'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Meta spend + balance, hourly pulse
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://rachnabuilds.com/api/cron/meta-spend?pulse=1${{ github.event.inputs.extra }}")
          cat /tmp/out.json
          [ "$code" = "200" ] || exit 1
