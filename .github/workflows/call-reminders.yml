name: Call reminder emails

# Vercel Hobby only allows daily crons, so GitHub Actions drives the
# 10-minute reminder cadence instead. GitHub may delay scheduled runs by
# a few minutes under load — the reminder windows are wide enough.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder check
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://rachnabuilds.com/api/cron/reminders)
          cat /tmp/out.json
          [ "$code" = "200" ] || exit 1
